name: application
on:
  pull_request:
    paths: [application/**, scripts/**, .github/workflows/application.yml]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [application/**, scripts/**, .github/workflows/application.yml]
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install -r application/sample-app/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: application/sample-app
  build:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    env:
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'eks-platform-apse1-dev-sample-app' }}
      TF_INPUT: "false"
      ROOT_INPUTS: ${{ vars.TFVARS_JSON }}
      PINNED_AMI: ${{ vars.KARPENTER_AMI_ID }}
      DNS_ZONE_NAME: ${{ vars.DNS_ZONE_NAME }}
      TF_VAR_infra_version: ${{ github.sha }}
      TF_VAR_kubernetes_version: ${{ vars.KUBERNETES_VERSION || '1.36' }}
      KUBERNETES_VERSION: ${{ vars.KUBERNETES_VERSION || '1.36' }}
      ENVIRONMENT: dev
      STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      REGION: ap-southeast-1
      GITOPS_REPO_URL: https://github.com/vipinkumar1234/aws-eks-production-platform.git
    steps:
      - uses: actions/checkout@v5
      - name: Show OIDC trust claims
        run: python3 scripts/print_oidc_claims.py
        env:
          EXPECTED_ENVIRONMENT: dev
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::001495086648:role/AutomationAdminAll
          audience: sts.amazonaws.com
          allowed-account-ids: '001495086648'
          aws-region: ap-southeast-1
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install boto3==1.43.89 PyYAML==6.0.2 jsonschema==4.26.0
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "1.14.0" }
      - name: Check infrastructure has created the image repository
        id: ecr_repository
        run: |
          set +e
          repository_uri=$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --query 'repositories[0].repositoryUri' --output text 2>/tmp/ecr-error.log)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "ECR repository \`$ECR_REPOSITORY\` does not exist yet."
              echo ""
              echo "Run the Terraform workflow with environment \`dev\` and action \`apply\` first, then rerun this application workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/ecr-error.log
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing_digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          echo "$repository_uri"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ -n "$existing_digest" ] && [ "$existing_digest" != "None" ]; then
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
            echo "IMAGE_URI=$repository_uri@$existing_digest" >> "$GITHUB_ENV"
            echo "Image tag \`$GITHUB_SHA\` already exists; reusing immutable digest \`$existing_digest\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.ecr_repository.outputs.ready == 'true' && steps.ecr_repository.outputs.image_exists != 'true'
        id: ecr
      - uses: docker/build-push-action@v7
        if: steps.ecr_repository.outputs.ready == 'true' && steps.ecr_repository.outputs.image_exists != 'true'
        with:
          context: application/sample-app
          push: false
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        if: steps.ecr_repository.outputs.ready == 'true' && steps.ecr_repository.outputs.image_exists != 'true'
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Push scanned image
        if: steps.ecr_repository.outputs.ready == 'true' && steps.ecr_repository.outputs.image_exists != 'true'
        run: docker push "$IMAGE"
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
      - name: Resolve immutable image digest
        if: steps.ecr_repository.outputs.ready == 'true' && steps.ecr_repository.outputs.image_exists != 'true'
        run: |
          DIGEST=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          echo "IMAGE_URI=$REGISTRY/$REPOSITORY@$DIGEST" >> "$GITHUB_ENV"
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
      - name: Resolve deployment defaults for GitOps rendering
        if: steps.ecr_repository.outputs.ready == 'true'
        run: python scripts/prepare_aws_deployment.py
      - name: Initialize Terraform state for GitOps rendering
        if: steps.ecr_repository.outputs.ready == 'true'
        run: python scripts/terraform_init.py --environment "$ENVIRONMENT" --bucket "$STATE_BUCKET" --region "$REGION" --check-only
      - name: Render dev GitOps image
        if: steps.ecr_repository.outputs.ready == 'true'
        id: gitops
        run: |
          python scripts/render_gitops.py --environment dev
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Rendered dev GitOps with image \`$IMAGE_URI\`." >> "$GITHUB_STEP_SUMMARY"
      - uses: peter-evans/create-pull-request@v8
        if: steps.gitops.outputs.ready == 'true'
        with:
          token: ${{ secrets.GITOPS_PR_TOKEN }}
          branch: deploy/dev-image
          title: Deploy scanned ArenaGrid image to dev
          commit-message: Render dev GitOps with scanned image digest
          body: Renders the dev GitOps tree from Terraform outputs and deploys the scanned ECR image digest. Merge this PR, then run the platform-bootstrap workflow from a VPC-connected runner.
          add-paths: gitops/environments/dev
