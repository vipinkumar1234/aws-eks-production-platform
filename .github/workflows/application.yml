name: application
on:
  pull_request:
    paths: [application/**, scripts/**, .github/workflows/application.yml]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [application/**]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r application/sample-app/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: application/sample-app
  build:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APP_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/build-push-action@v6
        with:
          context: application/sample-app
          push: false
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Push scanned image
        run: docker push "$IMAGE"
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
      - name: Resolve immutable image digest
        run: |
          DIGEST=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          echo "IMAGE_URI=$REGISTRY/$REPOSITORY@$DIGEST" >> "$GITHUB_ENV"
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      - name: Update dev GitOps image
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          manifest = Path("gitops/environments/dev/apps/sample-app/deployment.yaml")
          if not manifest.exists():
              raise SystemExit("Bootstrap and commit the rendered dev tree first; image has been published.")
          content = manifest.read_text()
          repository = os.environ["IMAGE_URI"]
          lines = content.splitlines()
          for index, line in enumerate(lines):
              if "image:" in line:
                  lines[index] = f"          image: {repository}"
                  break
          manifest.write_text("\n".join(lines) + "\n")
          PY
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_PR_TOKEN }}
          branch: deploy/dev-image
          title: Deploy scanned ArenaGrid image to dev
          commit-message: Update dev image digest
          body: Updates only the rendered dev workload to the scanned ECR digest. Review checks before merging.
          add-paths: gitops/environments/dev/apps/sample-app/deployment.yaml
