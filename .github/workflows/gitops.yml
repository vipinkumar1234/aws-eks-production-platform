name: gitops
on:
  push:
    branches: [main]
    paths: [gitops/**, scripts/**, .github/workflows/gitops.yml]
  pull_request:
    paths: [gitops/**, scripts/**, .github/workflows/gitops.yml]
permissions:
  contents: read
jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install PyYAML==6.0.2 boto3==1.43.89 jsonschema==4.26.0
      - run: python scripts/validate_yaml.py
      - run: python scripts/validate_karpenter.py
      - run: python scripts/validate_targetgroupbinding.py
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-go@v6
        with: { go-version: '1.24.0', cache: false }
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - name: Validate Kubernetes built-in schemas
        run: |
          find gitops -name '*.yaml' ! -name values.yaml -print0 | xargs -0 kubeconform -strict -summary -skip TargetGroupBinding,Application,AppProject,NodePool,EC2NodeClass
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: gitops
          framework: kubernetes
          quiet: true
          soft_fail: false
