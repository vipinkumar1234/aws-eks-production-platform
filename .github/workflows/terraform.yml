name: terraform
on:
  pull_request:
    paths: [terraform/**, scripts/**, .github/workflows/terraform.yml]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev
        required: true
      action:
        type: choice
        options: [plan, apply]
        default: plan
        required: true
permissions:
  contents: read
concurrency:
  group: terraform-${{ inputs.environment || 'validate' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.14.0" }
      - run: terraform fmt -check -recursive terraform
      - run: |
          for environment in dev prod; do
            terraform -chdir="terraform/environments/$environment" init -backend=false -input=false
            terraform -chdir="terraform/environments/$environment" validate
          done
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          minimum_severity: HIGH
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_INPUT: "false"
      ROOT_INPUTS: ${{ vars.TFVARS_JSON }}
      TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_cost_center: ${{ vars.COST_CENTER }}
      TF_VAR_karpenter_ami_id: ${{ vars.KARPENTER_AMI_ID }}
      TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
      TF_VAR_admin_role_arns: ${{ vars.ADMIN_ROLE_ARNS }}
      TF_VAR_github_oidc_subjects: ${{ vars.GITHUB_OIDC_SUBJECTS }}
      TF_VAR_infra_version: ${{ github.sha }}
      ENVIRONMENT: ${{ inputs.environment }}
      STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      REGION: ${{ inputs.environment == 'prod' && 'us-east-1' || 'ap-southeast-1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install boto3==1.43.89
      - run: python scripts/write_tfvars.py
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.14.0" }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.REGION }}
      - name: Create and secure state bucket before init
        run: python scripts/terraform_init.py --environment "$ENVIRONMENT" --bucket "$STATE_BUCKET" --region "$REGION"
      - run: terraform -chdir="terraform/environments/$ENVIRONMENT" plan -lock-timeout=5m -out=tfplan
      - if: inputs.action == 'apply'
        run: terraform -chdir="terraform/environments/$ENVIRONMENT" apply -lock-timeout=5m tfplan
