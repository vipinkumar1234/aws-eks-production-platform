apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: arenagrid-platform-alerts
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: arenagrid.platform
      rules:
        - alert: ArenaGridPodsUnavailable
          expr: kube_deployment_status_replicas_available{namespace="sample-app",deployment="sample-app"} < 2
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: ArenaGrid has fewer than two available replicas
        - alert: ArenaGridPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="sample-app"}[15m]) > 3
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: ArenaGrid container is repeatedly restarting
        - alert: ArenaGridTargetHealthMissing
          expr: absent(kube_endpoint_address_available{namespace="sample-app",endpoint="sample-app"})
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: ArenaGrid has no available service endpoints