apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: sample-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: sample-app }
  template:
    metadata:
      labels: { app: sample-app }
    spec:
      nodeSelector:
        workload-tier: application
      serviceAccountName: sample-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: sample-app }
      containers:
        - name: sample-app
          image: REPLACE_WITH_ECR_URL:IMAGE_TAG
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: ENVIRONMENT
              value: REPLACE_WITH_ENVIRONMENT
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
            - name: DYNAMODB_TABLE
              value: REPLACE_WITH_GAME_TABLE_NAME
            - name: AWS_REGION
              value: REPLACE_WITH_AWS_REGION
            - name: APP_ORIGIN
              value: https://REPLACE_WITH_APP_DOMAIN
            - name: COGNITO_DOMAIN
              value: https://REPLACE_WITH_COGNITO_USER_POOL_DOMAIN.auth.REPLACE_WITH_AWS_REGION.amazoncognito.com
            - name: COGNITO_CLIENT_ID
              value: REPLACE_WITH_COGNITO_CLIENT_ID
            - name: COGNITO_ISSUER
              value: REPLACE_WITH_COGNITO_ISSUER
            - name: SESSION_SECRET_ARN
              value: REPLACE_WITH_SESSION_SECRET_ARN
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 2, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, timeoutSeconds: 3 }
          startupProbe: { httpGet: { path: /healthz, port: http }, failureThreshold: 30, periodSeconds: 5 }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-app
  namespace: sample-app
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_GAME_ROLE_ARN
