apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: sample-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: sample-app }
  template:
    metadata:
      labels: { app: sample-app }
    spec:
      serviceAccountName: sample-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: sample-app }
      containers:
        - name: sample-app
          image: REPLACE_WITH_ECR_URL:IMAGE_TAG
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: PORT
              value: "8080"
            - name: DYNAMODB_TABLE
              value: REPLACE_WITH_GAME_TABLE_NAME
            - name: GAME_ID
              value: arena-default
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 2, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, timeoutSeconds: 3 }
          startupProbe: { httpGet: { path: /healthz, port: http }, failureThreshold: 30, periodSeconds: 5 }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-app
  namespace: sample-app
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_GAME_ROLE_ARN
